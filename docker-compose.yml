services:
  minsa-citas-whatsapp-bot:
    build: .
    image: minsa-citas-whatsapp-bot:latest
    container_name: minsa-citas-whatsapp-bot
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0

      DATABASE_ENABLED: ${DATABASE_ENABLED:-false}

      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:?set META_ACCESS_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:?set META_PHONE_NUMBER_ID}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:?set META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:?set META_APP_SECRET}

      MINSA_DIGITAL_APP_URL: ${MINSA_DIGITAL_APP_URL:?set MINSA_DIGITAL_APP_URL}
    volumes:
      - app-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  app-logs:
